ssl = yes
ssl_cert = </etc/dovecot/certs/mail.crt
ssl_key = </etc/dovecot/private/mail.key
ssl_min_protocol = TLSv1.2
ssl_cipher_list = ALL:!kRSA:!SRP:!kDHd:!DSS:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!MD5:!PSK:!RC4:!ADH:!LOW@STRENGTH

#DOMAIN_SSL_BEGIN_mail.b2bprosperity.com
local_name mail.b2bprosperity.com {
    ssl_cert = < /etc/ssl/mail/mail.b2bprosperity.com/fullchain.pem
    ssl_key = < /etc/ssl/mail/mail.b2bprosperity.com/privkey.pem
}
#DOMAIN_SSL_END_mail.b2bprosperity.com
